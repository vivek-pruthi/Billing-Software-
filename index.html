<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pro Billing System</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="invoice-wrapper">
        <header class="topbar">
          <div>
            <p class="eyebrow">Business Invoice</p>
            <h1>Nova Retail</h1>
          </div>
          <div class="status-badge">PAID / DUE</div>
        </header>

        <section class="billing-meta">
          <div class="meta-block">
            <label>Customer</label>
            <input id="customerName" type="text" value="Walk-in Customer" />
          </div>
          <div class="meta-block">
            <label>Invoice #</label>
            <input id="invoiceNumber" type="text" value="INV-1001" />
          </div>
          <div class="meta-block">
            <label>Date</label>
            <input id="invoiceDate" type="date" />
          </div>
          <div class="meta-block">
            <label>Payment</label>
            <select id="paymentMethod">
              <option>Cash</option>
              <option>Card</option>
              <option>UPI</option>
              <option>Bank Transfer</option>
            </select>
          </div>
        </section>

        <main class="content-grid">
          <section class="panel add-panel">
            <div class="panel-header">
              <h2>Add Product</h2>
            </div>

            <form id="billing-form">
              <div class="input-group">
                <label for="productName">Product Name</label>
                <input id="productName" type="text" placeholder="e.g. Wireless Mouse" required />
              </div>

              <div class="input-row">
                <div class="input-group">
                  <label for="quantity">Quantity</label>
                  <input id="quantity" type="number" min="1" value="1" required />
                </div>

                <div class="input-group">
                  <label for="price">Unit Price</label>
                  <input id="price" type="number" min="0" step="0.01" placeholder="0.00" required />
                </div>
              </div>

              <button type="submit" class="primary-btn">Add Item</button>
            </form>
          </section>

          <section class="panel table-panel">
            <div class="panel-header">
              <h2>Bill Items</h2>
              <button id="clearBill" class="secondary-btn" type="button">Clear</button>
            </div>

            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Product</th>
                    <th>Qty</th>
                    <th>Price</th>
                    <th>Total</th>
                    <th>Action</th>
                  </tr>
                </thead>
                <tbody id="billItems"></tbody>
              </table>
            </div>
          </section>
        </main>

        <section class="summary-panel panel">
          <div class="panel-header summary-header">
            <h2>Invoice Summary</h2>
            <div class="mini-stats">
              <span id="itemCount">0 Items</span>
            </div>
          </div>

          <div class="summary-grid">
            <div class="summary-box">
              <label for="discountPercent">Discount</label>
              <div class="inline-input">
                <input id="discountPercent" type="number" min="0" max="100" value="0" />
                <span>%</span>
              </div>
            </div>

            <div class="summary-box">
              <label for="taxPercent">Tax</label>
              <div class="inline-input">
                <input id="taxPercent" type="number" min="0" max="100" value="5" />
                <span>%</span>
              </div>
            </div>
          </div>

          <div class="summary-list">
            <div class="summary-item">
              <span>Subtotal</span>
              <strong id="subtotal">₹0.00</strong>
            </div>

            <div class="summary-item">
              <span>Discount</span>
              <strong id="discountAmount">₹0.00</strong>
            </div>

            <div class="summary-item">
              <span>Tax</span>
              <strong id="taxAmount">₹0.00</strong>
            </div>

            <div class="summary-item total">
              <span>Total</span>
              <strong id="grandTotal">₹0.00</strong>
            </div>
          </div>

          <div class="actions-row">
            <button type="button" class="secondary-btn" id="resetButton">Reset</button>
            <button type="button" class="primary-btn" id="printButton">Print Invoice</button>
          </div>
        </section>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
